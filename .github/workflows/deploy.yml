name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "multiplayer-test"]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY##*/}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            destination_dir="."
            vite_base="/${repo_name}/"
          else
            branch_slug="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"
            destination_dir="previews/${branch_slug}"
            vite_base="/${repo_name}/${destination_dir}/"
          fi

          echo "destination_dir=${destination_dir}" >> "$GITHUB_OUTPUT"
          echo "vite_base=${vite_base}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASE: ${{ steps.target.outputs.vite_base }}
        run: npm run build

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: ${{ steps.target.outputs.destination_dir }}
          keep_files: true